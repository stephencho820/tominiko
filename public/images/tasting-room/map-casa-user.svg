<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Casa di Stefano Tasting Room location map</title>
  <desc id="desc">Simplified illustrated map of Suwon showing Casa di Stefano, Gwanggyo stations, universities, Suwon World Cup Stadium, Hwaseong Haenggung, major roads, waterways and the Shinbundang Line.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <style>
      .local{fill:none;stroke:#fffdf8;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .local2{fill:none;stroke:#d8d2c7;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .highway-shadow{fill:none;stroke:#d8ad54;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
      .highway{fill:none;stroke:#f0c56d;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}
      .river{fill:none;stroke:#8cc3e8;stroke-width:24;stroke-linecap:round}
      .subway{fill:none;stroke:#9b1031;stroke-width:7;stroke-linecap:round}
      .station{fill:#f6f0e5;stroke:#9b1031;stroke-width:7}
      .dot{fill:#3b1d0f}
      .kr{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#2e2119;font-size:26px;font-weight:700}
      .en{font-family:Arial,sans-serif;fill:#4d4138;font-size:15px;font-weight:500;letter-spacing:2.4px}
      .brand{font-family:Georgia,"Times New Roman",serif;fill:#2d1b11;font-size:31px;letter-spacing:4px}
      .brandSub{font-family:Arial,sans-serif;fill:#4d4138;font-size:14px;letter-spacing:3px}
      .small{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#9b1031;font-size:18px;font-weight:700}
    </style>
  </defs>

