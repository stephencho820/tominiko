name: Product variants typecheck
on:
  pull_request:
    paths:
      - "components/**"
      - "app/**"
      - "lib/**"
      - "types/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/product-variants-typecheck.yml"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
